name: Actions smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify runner access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm Actions runner is available
        run: |
          echo "GitHub Actions is available for ${GITHUB_REPOSITORY}."
          echo "Commit: ${GITHUB_SHA}"
